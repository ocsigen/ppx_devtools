name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    env:
      OXCAML_OPAM_REPO_REF: d89747aa6e7b9f44d6cc844dca5b5e7c8a90716f

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - "4.14"
          - "5.5"
        ocaml-name:
          - ""
        include:
          - os: ubuntu-latest
            ocaml-compiler: "4.13"
          - os: ubuntu-latest
            ocaml-compiler: "5.1"
          - os: ubuntu-latest
            ocaml-name: "5.6+trunk"
            ocaml-compiler: "ocaml-variants.5.6.0+trunk"
          - os: ubuntu-latest
            ocaml-name: "OxCaml"
            ocaml-compiler: "ocaml-variants.5.2.0+ox"

    runs-on: ${{ matrix.os }}

    name: ${{ matrix.ocaml-name != '' && matrix.ocaml-name || matrix.ocaml-compiler }} / ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
        if: ${{ ! endsWith(matrix.ocaml-compiler, '+ox') }}

      - name: Set-up OxCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            ox: https://github.com/oxcaml/opam-repository.git#${{ env.OXCAML_OPAM_REPO_REF }}
        if: ${{ endsWith(matrix.ocaml-compiler, '+ox') }}

      - name: Pin ppxlib
        if: matrix.ocaml-name == '5.6+trunk'
        run: opam pin add -n ppxlib https://github.com/hhugo/ppxlib.git#support-5.6

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build @install @runtest

      - run: opam exec -- git diff --exit-code

  # The tests again, compiled with js_of_ocaml and wasm_of_ocaml. These
  # compilers depend on ppx_devtools, so they are not test dependencies of the
  # package.
  js-wasm:
    runs-on: ubuntu-latest

    name: js / wasm

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      - run: opam install . --deps-only --with-test

      - run: opam install js_of_ocaml-compiler wasm_of_ocaml-compiler

      - run: opam exec -- dune build @runtest-js

      - run: opam exec -- dune build @runtest-wasm
        env:
          WASM_OF_OCAML: true

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - uses: ocaml/setup-ocaml/lint-opam@v3
